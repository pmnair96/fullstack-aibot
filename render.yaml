services:
  # Backend API
  - type: web
    name: fullstack-aibot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        value: your_openrouter_api_key
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat-v3-0324:free
      - key: OPENROUTER_SITE_URL
        value: https://fullstack-aibot-backend.onrender.com
      - key: SECRET_KEY
        value: your-super-secret-key-change-this
    rootDir: ./backend
    
  # Frontend
  - type: web
    name: fullstack-aibot-frontend
    env: node
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/fullstack-aibot
    rootDir: ./frontend
    envVars:
      - key: API_URL
        value: https://fullstack-aibot-backend.onrender.com
