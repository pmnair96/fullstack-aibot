services:
  # Backend API Service
  - type: web
    name: fullstack-aibot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        value: 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
