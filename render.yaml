services:
  # Backend API Service
  - type: web
    name: fullstack-aibot-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AZURE_OPENAI_ENDPOINT
        value: https://lives-md0y3cx3-swedencentral.openai.azure.com/
      - key: AZURE_OPENAI_API_KEY
        value: 5TjGA5au7VnHB5Z9HUVF27dhpXdK5NLhRcIM9wxT6jOOGVvb7iSaJQQJ99BGACfhMk5XJ3w3AAAAACOGUU8E
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-02-15-preview
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        value: gpt-4o
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://zealous-feet.surge.sh
