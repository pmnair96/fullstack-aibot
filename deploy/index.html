<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Genie AI Assistant</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5; 
      height: 100vh; 
      display: flex; 
      flex-direction: column;
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      padding: 20px; 
      flex: 1; 
      display: flex; 
      flex-direction: column;
    }
    .header { 
      text-align: center; 
      margin-bottom: 30px; 
    }
    .chat-container { 
      flex: 1; 
      background: white; 
      border-radius: 10px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column;
    }
    .messages { 
      flex: 1; 
      overflow-y: auto; 
      margin-bottom: 20px; 
      padding: 10px;
    }
    .message { 
      margin-bottom: 15px; 
      padding: 10px; 
      border-radius: 8px; 
    }
    .user { 
      background: #007bff; 
      color: white; 
      margin-left: 20%; 
    }
    .assistant { 
      background: #f8f9fa; 
      margin-right: 20%; 
    }
    .input-area { 
      display: flex; 
      gap: 10px; 
    }
    .message-input { 
      flex: 1; 
      padding: 12px; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 16px;
    }
    .send-button { 
      padding: 12px 24px; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 16px;
    }
    .send-button:hover { background: #0056b3; }
    .send-button:disabled { background: #ccc; cursor: not-allowed; }
    .status { text-align: center; margin: 10px 0; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧞‍♂️ Genie AI Assistant</h1>
      <div class="status" id="status">Connecting to backend...</div>
    </div>
    
    <div class="chat-container">
      <div class="messages" id="messages">
        <div class="message assistant">
          Hello! I'm your AI assistant. How can I help you today?
        </div>
      </div>
      
      <div class="input-area">
        <input type="text" class="message-input" id="messageInput" placeholder="Type your message..." disabled>
        <button class="send-button" id="sendButton" onclick="sendMessage()" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://fullstack-aibot-backend.onrender.com/api';
    const status = document.getElementById('status');
    const messages = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    
    let isConnected = false;

    // Test backend connection
    async function testConnection() {
      try {
        status.textContent = 'Testing backend connection...';
        console.log('Checking health at:', API_URL + '/health');
        
        // Add retry logic for backend startup
        let retries = 3;
        let response;
        
        for (let i = 0; i < retries; i++) {
          try {
            response = await fetch(API_URL + '/health', {
              method: 'GET',
              headers: {
                'Accept': 'application/json',
              },
              timeout: 10000
            });
            break; // Success, exit retry loop
          } catch (error) {
            if (i === retries - 1) throw error; // Last retry failed
            status.textContent = `Retrying connection... (${i + 1}/${retries})`;
            await new Promise(resolve => setTimeout(resolve, 2000)); // Wait 2s
          }
        }
        
        const data = await response.json();
        
        if (response.ok) {
          status.textContent = '✅ Connected to backend - Ready to chat!';
          status.style.color = '#28a745';
          isConnected = true;
          messageInput.disabled = false;
          sendButton.disabled = false;
          messageInput.focus();
          console.log('Backend health:', data);
        } else {
          throw new Error(`Health check failed: ${response.status}`);
        }
      } catch (error) {
        console.error('Backend connection failed:', error);
        status.textContent = '❌ Backend starting up... Please wait 30 seconds and refresh the page.';
        status.style.color = '#dc3545';
        
        // Auto-retry after 30 seconds
        setTimeout(() => {
          status.textContent = 'Retrying connection...';
          testConnection();
        }, 30000);
      }
    }

    // Send message
    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message || !isConnected) return;

      // Add user message
      addMessage(message, 'user');
      messageInput.value = '';
      sendButton.disabled = true;
      sendButton.textContent = 'Sending...';

      try {
        console.log('Sending message to:', API_URL + '/chat');
        console.log('Message:', message);
        
        const response = await fetch(API_URL + '/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        
        if (response.ok) {
          addMessage(data.response || data.message || 'No response received', 'assistant');
        } else {
          console.error('Chat API error:', response.status, data);
          addMessage('Sorry, I encountered an error. Please try again.', 'assistant');
        }
      } catch (error) {
        console.error('Error sending message:', error);
        addMessage('Sorry, I\'m having trouble connecting to the server. Please try again.', 'assistant');
      }

      sendButton.disabled = false;
      sendButton.textContent = 'Send';
      messageInput.focus();
    }

    // Add message to chat
    function addMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}`;
      messageDiv.textContent = text;
      messages.appendChild(messageDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    // Handle Enter key
    messageInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && !sendButton.disabled) {
        sendMessage();
      }
    });

    // Initialize
    testConnection();
  </script>
</body>
</html>
